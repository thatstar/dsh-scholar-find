# dsh-scholar bundle patch
#
# This file is the `dsh.bundle.patch` layer of the plugin package. When the
# plugin is installed through the DSH plugin CLI,
#
#   dsh plugin --profile <name> add dsh-scholar   (or a path / git / file: spec)
#
# the CLI reconciles `dsh.profile.bundles` against installed packages and,
# seeing this declaration, appends `dsh-scholar` to the bundle stack. The
# profile boot then merges this patch (a single `insert` of the plugin row)
# into the host composition.
#
# The plugin registers, from its `apply(ctx)`:
#   - the `dsh-scholar` settings section (Web UI: Settings -> Plugins ->
#     Plugin configuration),
#   - the `scholar_search_*` / `paper_fetch_*` tools,
#   - the companion-instructions prompt section.
- insert:
    - id: dsh-scholar
      name: 'dsh-scholar'